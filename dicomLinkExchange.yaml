openapi: 3.0.0

info:
  title: DLX API
  description: Prototype of the DICOM Link Exchange (DLX) initiative. The API represents the outcome of an initiative of medical imaging software manufactures to standardize downloads from their systems.
  version: "2.0"

servers:
  - url: /dlx/v2
    description: DICOM Link Exchange (DLX) server

paths:
  /api_info:
    description: Provides information on version and implemented capabilities of the API.
    get:
      tags:
      - DLX-Info
      - DLX-ConsumerContext
      - DLX-ManagementContext
      responses:
        "200":
          description: A JSON string representing information about the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiInfo'
        "5XX":
          $ref: '#/components/responses/unexpectedError'

  /token/{value}:
    description: The initial call which accepts only the token (e.g. from a link or QR code) and responds with the TFA questions for the calling system to generate a JWT for all further requests. To enhance security, this call always returns successfully, even if the token value does not actually exist. The feedback on failed or successful authentication is provided by the subsequent /tokentfa/{value} endpoint. To enable the DLX functionalities the HTTP header parameter X-DICOM-LINK-EXCHANGE is required. This allowes pre-existing token URLs to forward to this API endpoint (e.g. https://example.com/portal?token={value} with a HTTP header X-DICOM-LINK-EXCHANGE should return the same result as the defined DLX endpoint https://example.com/dlx/v2/token/{value}) .
    get:
      tags:
        - DLX-Download
        - DLX-ConsumerContext
      parameters:
        - in: header
          name: X-DICOM-LINK-EXCHANGE # optional, and used to activate the DLX API functionality
          schema: 
            type: string # header must exist but value is not evaluated
        - in: path
          name: value
          description: Token value which identifies the download package, e.g. an alpha numerical code like ABC-S1Z-98A.
          required: true
          schema:
            type: string 
      responses:
        "200":
          description: Returns the two-factor authentification (TFA) questions in JSON format. If the token value does not exist, a default question scheme MUST be returned, e.g. to query the date of birth, which always returns a negative result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tfaQuestions'
        "5XX":
          $ref: '#/components/responses/unexpectedError'

  /tokentfa/{value}:
    description: Request to answer the TFA questions from the initial token call. The questions and answers are mapped by their questionId. 
    post:
      tags:
        - DLX-Download
        - DLX-ConsumerContext
      parameters:
        - in: path
          name: value
          description: Token value which identifies the download package, e.g. an alpha numerical code like ABC-S1Z-98A.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tfaAnswers'
        required: true
      responses:
        "200":
          description: Response with a valid JWT.
          content:
            application/jwt:
              schema:
                type: string
        "401":
          description: Authentication failed. Token does not exist or additional factors do not match.
        "403":
          description: Authentication failed. Token expired but additional factors match. All other errors should result in error code 401.
        "5XX":
          $ref: '#/components/responses/unexpectedError'

  /list:
    description: Returns a list of the metadata of all available medical data items.
    get:
      tags:
        - DLX-Download
        - DLX-ConsumerContext
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A list of medical data items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dataItems'
        "401":
          $ref: '#/components/responses/invalidCredentials'
        "5XX":
          $ref: '#/components/responses/unexpectedError'

  /download/{id}:
    description: Returns the data item for the given id with the specified mimeType.
    get:
      tags:
        - DLX-Download
        - DLX-ConsumerContext
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          description: ID, which identifies the data item.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns the referenced data item as binary stream with the specified mimeType (e.g. application/pdf). If the data item contains multiple files resp. a DICOM study, a ZIP file stream is returned (application/zip). DICOM studies MUST always conform to IHE PDI in ZIP format.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: '#/components/responses/invalidDataItemId'
        "401":
          $ref: '#/components/responses/invalidCredentials'
        "503":
          $ref: '#/components/responses/comebackLater'
        "5XX":
          $ref: '#/components/responses/unexpectedError'

  /downloadall:
    description: Returns all data items as ZIP container in IHE PDI format.
    get:
      tags:
        - DLX-Download
        - DLX-ConsumerContext
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Returns all data items in a ZIP file stream (application/zip). The download MUST conform to the IHE PDI in ZIP format.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: '#/components/responses/invalidCredentials'
        "503":
          $ref: '#/components/responses/comebackLater'
        "5XX":
          $ref: '#/components/responses/unexpectedError'

  /admin_auth:
    description: |
      Endpoint to authenticate with administrative credentials (e.g. for DLX-Tokens or DLX-Import operations) and receive a JWT for bearer authentication in subsequent requests. The JWT must contain the appropriate scopes (dlx.tokens or dlx.import) to access the respective endpoints.
      The authentication method (e.g. username/password, client certificate, etc.) is implementation-specific and not defined by the API specification. The request and response formats are also flexible to allow for different authentication methods, but a common approach is to use a JSON payload for the request and return the JWT in a JSON response.
    post:
      operationId: adminAuth
      summary: Authenticate with administrative credentials and receive a JWT
      description: |
        Authenticates the user with administrative credentials and returns a JWT 
        for bearer authentication in subsequent requests. The JWT must contain 
        the appropriate scopes (dlx.tokens, dlx.import) to 
        access the respective endpoints.
        
        The request payload is implementation-specific. Implementations may 
        accept different credential types (username/password, client credentials, 
        API key, etc.). The schema below shows a common example but implementations 
        may define their own fields.
      tags:
        - DLX-ManagementContext
      requestBody:
        required: true
        description: |
          Implementation-specific authentication payload.
          Common fields are shown below but implementations may use different fields.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/adminAuthRequest'
      responses:
        "200":
          description: Authentication successful. JWT returned in response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/adminAuthResponse'
        "400":
          description: Bad request.
        "401":
          description: Authentication failed. Invalid credentials.
        "5XX":
          $ref: '#/components/responses/unexpectedError'
          
  /tfa_info:
    description: |
      Returns information about supported two-factor authentication (TFA) options.
    get:
      operationId: getTfaInfo
      summary: Get supported two-factor authentication (TFA) options
      description: |
        Returns information about supported two-factor authentication (TFA) options.
        
        To use this endpoint with bearerAuth, the JWT must contain the dlx.derive scope.
        The dlx.derive scope is only granted when the creating token was created with allowDerivation set to true.
      tags:
        - DLX-Tokens
        - DLX-Info
        - DLX-ManagementContext
        - DLX-ConsumerContext
      security:
        - adminBearerAuth: [dlx.tokens]
        - bearerAuth: [dlx.derive]
      responses:
        "200":
          description: Supported TFA options returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tfaInfo'
        "401":
          description: Not authorized.
        "5XX":
          $ref: '#/components/responses/unexpectedError'
  
  /tokens:
    post:
      operationId: createToken
      summary: Create a DLX token link for one or more DICOM studies
      description: |
        Creates a DLX token link that grants access to download one or more DICOM studies.
        Optional two-factor authentication (TFA) methods can be configured to protect the link.
        
        To use this endpoint with bearerAuth, the JWT must contain the dlx.derive scope.
        The dlx.derive scope is only granted when the creating token was created with allowDerivation set to true.
        When using bearerAuth, the created token must be a subset of the creating token's permissions:
        - The expiresAt date cannot be later than the creating token's expiresAt
        - The data items (studies) cannot exceed those allowed by the creating token
        - The allowDerivation flag cannot be set to true unless the creating token has derivation enabled
      tags:
        - DLX-Tokens
        - DLX-ManagementContext
        - DLX-ConsumerContext
      requestBody:
        description: Parameters for creating a DLX download link.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tokensRequest'
      responses:
        "200":
          description: DLX download link and associated metadata created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokensResponse'
        "400":
          description: Bad request.
        "401":
          description: Not authorized.
        "403":
          description: Not allowed.
        "5XX":
          $ref: '#/components/responses/unexpectedError'
      security:
        - adminBearerAuth: [dlx.tokens]
        - bearerAuth: [dlx.derive]
    get:
      operationId: listTokens
      summary: List all DLX token links
      description: |
        Returns a paginated list of all DLX token links with metadata.
        Pagination follows RFC 8288 semantics. The response contains pagination metadata and the list of token links.
        
        To use this endpoint with bearerAuth, the JWT must contain the dlx.derive scope.
        The dlx.derive scope is only granted when the creating token was created with allowDerivation set to true.
      tags:
        - DLX-Tokens
        - DLX-ManagementContext
        - DLX-ConsumerContext
      parameters:
        - in: query
          name: page
          description: Page number to retrieve (1-indexed). Defaults to 1.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          description: Number of items per page. Defaults to 20.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: patientId
          description: Filter by patient ID. Multiple parameters are combined with AND logic.
          required: false
          schema:
            type: string
        - in: query
          name: studyInstanceUID
          description: "Filter by Study Instance UID. Multiple values (comma-separated) are combined with OR logic. Example: '?studyInstanceUID=uid1,uid2' returns tokens linked to either UID. Parameters are combined with AND logic."
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - in: query
          name: accessionNumber
          description: "Filter by accession number. Multiple values (comma-separated) are combined with OR logic. Example: '?accessionNumber=acc1,acc2' returns tokens linked to either accession number. Parameters are combined with AND logic."
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - in: query
          name: sort
          description: Sort field (ascending order).
          required: false
          schema:
            type: string
            enum: [issuedAt, expiresAt]
            default: issuedAt
      responses:
        "200":
          description: Paginated list of DLX token links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/paginatedTokensResponse'
        "401":
          description: Not Authorized.
        "5XX":
          $ref: '#/components/responses/unexpectedError'
      security:
        - adminBearerAuth: [dlx.tokens]
        - bearerAuth: [dlx.derive]
        
  /tokens/{token}:
    get:
      operationId: getToken
      summary: Get details of a DLX token link
      description: |
        Returns details for a single DLX token link.
        
        To use this endpoint with bearerAuth, the JWT must contain the dlx.derive scope.
        The dlx.derive scope is only granted when the creating token was created with allowDerivation set to true.
      tags:
        - DLX-Tokens
        - DLX-ManagementContext
        - DLX-ConsumerContext
      parameters:
        - in: path
          name: token
          description: Token value which identifies the DLX link.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DLX token link details returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokensResponse'
        "401":
          description: Not Authorized.
        "404":
          description: Token not found.
        "5XX":
          $ref: '#/components/responses/unexpectedError'
      security:
        - adminBearerAuth: [dlx.tokens]
        - bearerAuth: [dlx.derive]
    put:
      operationId: updateToken
      summary: Update a DLX token link
      description: |
        Updates the properties of an existing DLX token link.
        
        To use this endpoint with bearerAuth, the JWT must contain the dlx.derive scope.
        The dlx.derive scope is only granted when the creating token was created with allowDerivation set to true.
        When using bearerAuth, the updated token must be a subset of the creating token's permissions:
        - The expiresAt date cannot be later than the creating token's expiresAt
        - The data items (studies) cannot exceed those allowed by the creating token
        - The allowDerivation flag cannot be set to true unless the creating token has derivation enabled
      tags:
        - DLX-Tokens
        - DLX-ManagementContext
        - DLX-ConsumerContext
      parameters:
        - in: path
          name: token
          description: Token value which identifies the DLX link.
          required: true
          schema:
            type: string
      requestBody:
        description: Updated parameters for the DLX token link.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tokensRequest'
      responses:
        "200":
          description: DLX token link updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokensResponse'
        "400":
          description: Bad request.
        "401":
          description: Not authorized.
        "404":
          description: Token not found.
        "5XX":
          $ref: '#/components/responses/unexpectedError'
      security:
        - adminBearerAuth: [dlx.tokens]
        - bearerAuth: [dlx.derive]
    delete:
      operationId: deleteToken
      summary: Delete a DLX token link
      description: |
        Deletes a DLX token link and revokes access.
        
        To use this endpoint with bearerAuth, the JWT must contain the dlx.derive scope.
        The dlx.derive scope is only granted when the creating token was created with allowDerivation set to true.
      tags:
        - DLX-Tokens
        - DLX-ManagementContext
        - DLX-ConsumerContext
      parameters:
        - in: path
          name: token
          description: Token value which identifies the DLX link.
          required: true
          schema:
            type: string
      responses:
        "204":
          description: DLX token link deleted successfully.
        "401":
          description: Not Authorized.
        "404":
          description: Token not found.
        "5XX":
          $ref: '#/components/responses/unexpectedError'
      security:
        - adminBearerAuth: [dlx.tokens]
        - bearerAuth: [dlx.derive]

  /import:
    post:
      operationId: import
      summary: Import data from an external DLX link
      description: |
        Triggers the import of data from an external DLX link (token) and immediately returns a response. The actual data transfer is processed asynchronously in the background. If the import completes within a short time (e.g., 10 seconds), a 200 response with the imported data is returned. If the import takes longer, a 202 response is returned, optionally including a statusUrl for tracking the import progress. The statusUrl allows the provider to supply a page or API endpoint for status updates; its usage is implementation-specific.
      tags:
        - DLX-Import
        - DLX-ManagementContext
      requestBody:
        description: Parameters for importing an external DLX link.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/importRequest'
      responses:
        "200":
          description: Import completed. Metadata returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/importResponse'
        "202":
          description: Import started. Transfer initiated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/importResponse'
        "400":
          description: Bad request.
        "401":
          description: Not authorized.
        "5XX":
          $ref: '#/components/responses/unexpectedError'
      security:
        - adminBearerAuth: [dlx.import]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer authentication for DLX-Download endpoints.
        
        The JWT may contain the following scopes:
        - `dlx.derive` - Additional access to create derived tokens via /tokens endpoint
        
        When using /tokens endpoints with bearerAuth, the JWT must contain `dlx.derive` scope.

    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer authentication for DLX administrative operations (DLX-Tokens and DLX-Import).
        The JWT may contain the following scopes:

        * `dlx.tokens`  - Create and manage DLX token links (DLX-Tokens endpoints)
        * `dlx.import` - Import data from external DLX links (DLX-Import endpoints)

  schemas:
    adminAuthRequest:
      type: object
      description: |
        Request payload for administrative authentication.
        The exact fields are implementation-specific. The schema below 
        shows common fields for username/password authentication.
        Implementations may require different fields (e.g. clientId, clientSecret, 
        apiKey, certificate, etc.).
      properties:
        username:
          type: string
          description: Username for authentication (implementation-specific).
        password:
          type: string
          description: Password or secret for authentication (implementation-specific).
        scope:
          type: string
          description: |
            Requested OAuth 2.0 scope(s). Space-separated list of:
            - dlx.tokens  - Manage DLX token links
            - dlx.import - Import data from external DLX links
            Example: "dlx.tokens" or "dlx.tokens dlx.import"
      example:
        username: "admin"
        password: "secret"
        scope: "dlx.tokens"

    adminAuthResponse:
      type: object
      required:
        - access_token
        - token_type
      properties:
        access_token:
          type: string
          description: JWT access token for bearer authentication in subsequent requests.
        token_type:
          type: string
          description: The type of the token issued. Value is case insensitive.
          example: Bearer
        expires_in:
          type: integer
          description: The lifetime in seconds of the access token.
        refresh_token:
          type: string
          description: Optional refresh token to obtain a new access token after expiration.
        scope:
          type: string
          description: The scope(s) granted to the access token. Space-separated list of scopes (e.g. "dlx.tokens dlx.import").
      example:
        access_token: "eyJhbGciOiJSUzI1NiIs..."
        token_type: Bearer
        expires_in: 3600
        scope: "dlx.tokens"

    apiInfo:
      description: General information about the API, version, and supported capabilities.
      type: object
      required:
        - dlxVersion
        - apiBasePath
      properties:
          dlxVersion:
              type: string
          vendorInformation:
              type: string
          contactInformation:
              type: string              
          apiBasePath:
              type: string
          capabilities:
              type: object
              description: |
                Indicates which optional features/endpoints are supported by this implementation. Example: { "download": true, "tokens": true, "import": false }
              properties:
                  download:
                      type: boolean
                      description: Whether the DLX-Download endpoints (token, list, download, downloadall, etc.) are supported.
                  tokens:
                      type: boolean
                      description: Whether the /tokens endpoint is supported.
                  import:
                      type: boolean
                      description: Whether the /import endpoint is supported.
                  derivation:
                      type: boolean
                      description: Whether token derivation is supported (creating derived tokens via /tokens endpoint with dlx.derive scope).
                  dicomweb:
                      $ref: '#/components/schemas/dicomwebCapabilities'
              additionalProperties:
                  type: object
      example:
          dlxVersion: v2
          vendorInformation: DLX Company Ltd.
          contactInformation: "Radiology, +1 234 567 890, support@radiology.dlx"
          apiBasePath: https://example.com/portal/dlx/v2
          capabilities:
              download: true
              tokens: true
              import: false
              derivation: true
              dicomweb:
                  wadoRs:
                      available: true
                      url: https://example.com/dicomweb/wado-rs
                  qidoRs:
                      available: false

    tfaQuestions:
      description: Information about the API and list of tfa questions.
      type: object
      properties: 
        apiInfo:
          type: array
          items:
            $ref: '#/components/schemas/apiInfo'
        tfaQuestion:
          type: array
          items:
            $ref: '#/components/schemas/tfaQuestion'
      example:
        tfaQuestion:
          - question: [{text: "Wann ist Ihr Geburtsdatum?",language: "de"}, {text: "What is your date of birth?",language: "en"}]
            questionId: "1"
            questionType: PAT_BIRTH_DATE
            answerFormat: DATE
          - question: [{text: "Wie heißt Ihr Hausarzt?", language: "de"}, {text: "What is the name of your family doctor?", language: "en"}]
            questionId: "2"
            questionType: CUSTOM
            answerFormat: STRING

    tfaQuestion:
        description: Tfa question that must be answered by the user or an automated system.
        type: object
        properties:
          question:
            type: array
            items:
              $ref: '#/components/schemas/question'
          questionId:
            type: string
          questionType:
            type: string
            enum: [PAT_BIRTH_DATE, STUDY_DATE, PASSWORD, CUSTOM]
            description: |
              Format:
              * `PAT_BIRTH_DATE` - e.g. date from DICOM: Patient's Birth Date (0010,0030)
              * `STUDY_DATE` - e.g. date from DICOM: Study Date (0008,0020)
              * `PASSWORD` - e.g. an OTP oder TOTP as string
              * `CUSTOM` - any custom value which is not specified above
          answerFormat:
            type: string
            enum: [DATE, STRING]
            description: |
              Format:
              * `DATE` - date formated as YYYYMMDD
              * `STRING` - arbitrary string
        example:
          question: [{text: "Wann ist Ihr Geburtsdatum?",language: "de"}, {text: "What is your date of birth?",language: "en"}]
          questionId: "1"
          questionType: PAT_BIRTH_DATE
          answerFormat: DATE

    question:
      description: Question, which is localizable (ISO 639).
      type: object
      required:
        - text
      properties:
        text:
          type: string 
        language:
          type: string # Language as ISO 639 language code (e.g. 'de', 'en' etc.)
      example:
        text: Wann ist ihr Geburtsdatum?
        language: de

    tfaAnswers:
      description: List of tfa answers.
      type: object
      properties: 
        tfaAnswer:
          type: array
          items:
            $ref: '#/components/schemas/tfaAnswer'
      example:
        tfaAnswer:
          - questionId: "1"
            answer: "19700101"
          - questionId: "2"
            answer: "Dr. Bob"

    tfaAnswer:
      description: Tfa answer, referenced by its ID.
      type: object
      properties:
        questionId:
          type: string
        answer:
          type: string
      example:
        questionId: "1"
        answer: "19700101"

    dataItems:
      description: List of data items.
      type: object
      properties: 
        dataItem:
          type: array
          items:
            $ref: '#/components/schemas/dataItem'
      example:
        dataItem: 
          - id: ee26fd29-fdcb-469d-a4f7-7c6de8607f71
            patientId: PID123
            accessionNumber: ACC456
            mimeType: application/pdf
            description: Radiological report
            date: "20240419"
            patientsName: Mustermann,Max
            patientsBirthdate: "19700101"
            patientsSex: M
          - id: 9bd78345-6538-4219-9756-a979c9379730
            patientId: PID123
            accessionNumber: ACC456
            mimeType: image/jpeg
            description: Wound documentation
            date: "20240419"
            patientsName: Mustermann,Max
            patientsBirthdate: "19700101"
            patientsSex: M
          - id: 2de7773a-09df-46f1-98fb-9eeaaaeba802
            patientId: PID123
            accessionNumber: ACC456
            mimeType: application/zip
            description: DICOM Study as ZIP file
            studyInstanceUID: 1.2.276.0.23.60.1.2.14841915742092284318.1713520221786.0
            date: "20240419"
            modalities: OT
            patientsName: Mustermann,Max
            patientsBirthdate: "19700101"
            patientsSex: M
            fileCount: 3

    dataItem:
      description: A data item represents a single object for the given token. This could be a report in PDF format (application/pdf), an image in JPEG format (image/jpeg) or a single DICOM file (application/dicom). DICOM studies SHOULD ALWAYS be bundled as ZIP files conforming to the IHE PDI profile with the mimeType application/zip. 
      type: object
      required:
        - id
        - mimeType
        - description
      properties:
        id:
          type: string
        mimeType:           # application/dicom, application/pdf, application/zip, ...
          type: string
        description:        # DICOM: studyDescription (0008,1030)
          type: string
        studyInstanceUID:   # DICOM: studyInstanceUID (0020,000D)
          type: string
        date:               # DICOM: studyDate (0008,0020)
          type: string
          format: date
        modalities:         # DICOM: modality (0008,0060) resp. modalitiesInStudy (0008,0061)
          type: string
        patientsName:       # DICOM: patientsName (0010,0010)
          type: string
        patientsBirthdate:  # DICOM: patientsBirthdate (0010,0030)
          type: string 
          format: date
        patientsSex:        # DICOM: patientsSex (0010,0040)
          type: string
        patientId:          # DICOM: patientID (0010,0020)
          type: string
        accessionNumber:    # DICOM: AccessionNumber (0008,0050)
          type: string
        fileCount:          # number of files in a ZIP container
          type: integer

    comebackLaterResponse:
      type: object
      nullable: true
      properties:
        timeOutInSeconds:
          type: integer
          minimum: 0
      example:
        timeOutInSeconds: 30

    tfaInfo:
      description: Information about the API and list of all tfa questions.
      type: object
      properties: 
        apiInfo:
          type: array
          items:
            $ref: '#/components/schemas/apiInfo'
        tfaQuestion:
          type: array
          items:
            $ref: '#/components/schemas/tfaQuestion'   
    tokensRequest:
      type: object
      required:
        - patientId
      description: Request payload for creating a DLX download link for one or more studies.
      properties:
        patientId:
          type: string
          description: Unique identifier of the patient (e.g., from DICOM tag PatientID (0010,0020)).
        studyInstanceUIDs:
          type: array
          description: List of Study Instance UIDs (DICOM tag StudyInstanceUID (0020,000D)) that should be included in the download link.
          items:
            type: string
        accessionNumbers:
          type: array
          description: List of accession numbers (DICOM tag AccessionNumber (0008,0050)) that should be included in the download link.
          items:
            type: string
        expiresAt:
          $ref: '#/components/schemas/dateTime'
        tfaAnswer:
          type: array
          items:
            $ref: '#/components/schemas/tfaAnswer'
        allowDerivation:
          type: boolean
          default: false
          description: Whether the created token can create further derived tokens. When set to true, the token can be used to access DLX-Tokens endpoints via bearerAuth with the dlx.derive scope.
      example:
        patientId: PID123
        studyInstanceUIDs:
          - 1.2.276.0.23.60.1.2.14841915742092284318.1713520221786.0
        expiresAt: 2022-03-10T16:15:50Z
        tfaAnswer:
          - questionId: "1"
            answer: "19700101"
        allowDerivation: true
    tokensResponse:
      description: Requested Link with Token and second factor.
      type: object
      required:
        - link
        - issuer
        - issuedAt
        - expiresAt
        - token
        - tfaAnswer
      properties:
        link:
          type: string
        issuer:
          type: string
        issuedAt:
          $ref: '#/components/schemas/dateTime'
        expiresAt:
          $ref: '#/components/schemas/dateTime'
        token:
          type: string
        tfaAnswer:
          type: array
          items:
            $ref: '#/components/schemas/tfaAnswer'
        dataItems:
          $ref: '#/components/schemas/dataItems'
        allowDerivation:
          type: boolean
          description: Whether this token can create derived tokens via the /tokens endpoint. When true, the token can be used to access DLX-Tokens endpoints via bearerAuth with the dlx.derive scope.
        parentToken:
          type: string
          description: Parent token value if this is a derived token. Only present for derived tokens.
      example:
        link: https://www.example.dlx/dlx/v2/token/ABC-S1Z-98A
        issuer: Example Hospital
        issuedAt: 2022-02-10T16:15:50Z
        expiresAt: 2022-03-10T16:15:50Z
        token: ABC-S1Z-98A
        tfaAnswer:
          - questionId: "1"
            answer: "19700101"
        allowDerivation: true
        dataItems:
          dataItem:
            - id: ee26fd29-fdcb-469d-a4f7-7c6de8607f71
              patientId: PID123
              accessionNumber: ACC456
              mimeType: application/pdf
              description: Radiological report
              date: "20240419"
              patientsName: Mustermann,Max
              patientsBirthdate: "19700101"
              patientsSex: M

    paginatedTokensResponse:
      description: |
        Paginated list of DLX token links. Pagination follows RFC 8288 (Web Linking) semantics.
      type: object
      required:
        - totalItems
        - page
        - pageSize
        - items
      properties:
        totalItems:
          type: integer
          minimum: 0
          description: Total number of token links available.
        page:
          type: integer
          minimum: 1
          description: Current page number (1-indexed).
        pageSize:
          type: integer
          minimum: 1
          description: Number of items per page.
        items:
          type: array
          description: List of token links for the current page.
          items:
            $ref: '#/components/schemas/tokensResponse'
      example:
        totalItems: 42
        page: 1
        pageSize: 20
        items:
          - link: https://www.example.dlx/dlx/v2/token/ABC-S1Z-98A
            issuer: Example Hospital
            issuedAt: 2022-02-10T16:15:50Z
            expiresAt: 2022-03-10T16:15:50Z
            token: ABC-S1Z-98A
            tfaAnswer:
              - questionId: "1"
                answer: "19700101"
            allowDerivation: false
            dataItems:
              dataItem:
                - id: ee26fd29-fdcb-469d-a4f7-7c6de8607f71
                  patientId: PID123
                  accessionNumber: ACC456
                  mimeType: application/pdf
                  description: Radiological report
                  date: "20240419"
                  patientsName: Mustermann,Max
                  patientsBirthdate: "19700101"
                  patientsSex: M
                - id: 9bd78345-6538-4219-9756-a979c9379730
                  patientId: PID123
                  accessionNumber: ACC456
                  mimeType: image/jpeg
                  description: Wound documentation
                  date: "20240419"
                  patientsName: Mustermann,Max
                  patientsBirthdate: "19700101"
                  patientsSex: M
                - id: 2de7773a-09df-46f1-98fb-9eeaaaeba802
                  patientId: PID123
                  accessionNumber: ACC456
                  mimeType: application/zip
                  description: DICOM Study as ZIP file
                  studyInstanceUID: 1.2.276.0.23.60.1.2.14841915742092284318.1713520221786.0
                  date: "20240419"
                  modalities: OT
                  patientsName: Mustermann,Max
                  patientsBirthdate: "19700101"
                  patientsSex: M
                  fileCount: 3
          - link: https://www.example.dlx/dlx/v2/token/DER-IV8-42X
            issuer: Example Hospital
            issuedAt: 2022-02-11T10:00:00Z
            expiresAt: 2022-03-11T10:00:00Z
            token: DER-IV8-42X
            tfaAnswer:
              - questionId: "1"
                answer: "19850315"
            allowDerivation: true
            dataItems:
              dataItem: []
          - link: https://www.example.dlx/dlx/v2/token/CHD-1LD-77Y
            issuer: Example Hospital
            issuedAt: 2022-02-12T14:30:00Z
            expiresAt: 2022-02-20T14:30:00Z
            token: CHD-1LD-77Y
            tfaAnswer:
              - questionId: "1"
                answer: "19700101"
            allowDerivation: false
            parentToken: DER-IV8-42X
            dataItems:
              dataItem:
                - id: ee26fd29-fdcb-469d-a4f7-7c6de8607f71
                  patientId: PID123
                  accessionNumber: ACC456
                  mimeType: application/pdf
                  description: Radiological report
                  date: "20240419"
                  patientsName: Mustermann,Max
                  patientsBirthdate: "19700101"
                  patientsSex: M

    importRequest:
      type: object
      required:
        - apiBasePath
        - token
        - tfaAnswer
      description: Request to automatically import data with an external DLX server.
      properties:
        apiBasePath:
          type: string
          description: External DLX api link (base path).
          example: https://www.example.dlx/dlx/v2/
        token:
          type: string
          description: Token value from the external DLX link.
          example: DER-IV8-42X
        tfaAnswer:
          type: array
          items:
            $ref: '#/components/schemas/tfaAnswer'
          description: Answers to TFA questions.
        
    importResponse:
      type: object
      description: Response with status and metadata about the import (includuing remoteItems of external DLX api e.g. https://www.example.dlx/dlx/v2/list).
      properties:
        message:
          type: string
          description: Optional status or error message.
        statusUrl:
          type: string
          description: Optional URL to a status page where users can track the import progress (implementation-specific).
        remoteItems:
          $ref: '#/components/schemas/dataItems'          
        

    dateTime:
      description: Date and time in ISO 8601 format (e.g., 2022-03-10T16:15:50Z).
      format: date-time
      type: string
      example: 2022-03-10T16:15:50Z

    dicomwebCapabilities:
      type: object
      description: |
        DLX-specific DICOMweb capabilities structure.
        Describes which DICOMweb services are available and their endpoints.
        The DLX bearer token SHOULD be accepted for authentication at these endpoints,
        limited to the studyInstanceUIDs the token was issued for.
        See DICOM PS3.18 for DICOMweb specification.
      properties:
        wadoRs:
          type: object
          description: |
            WADO-RS (DICOMweb Retrieve) capability.
            See DICOM PS3.18 Section 10.4 for specification.
          properties:
            available:
              type: boolean
              default: false
              description: Whether WADO-RS is available.
            url:
              type: string
              format: uri
              description: |
                Base URL for WADO-RS endpoints (absolute).
                Required when available=true.
                Example: https://example.com/dicomweb/wado-rs
        qidoRs:
          type: object
          description: |
            QIDO-RS (DICOMweb Query) capability.
            See DICOM PS3.18 Section 10.6 for specification.
          properties:
            available:
              type: boolean
              default: false
              description: Whether QIDO-RS is available.
            url:
              type: string
              format: uri
              description: Base URL for QIDO-RS endpoints (absolute).
      additionalProperties:
        type: object

  responses:
    invalidCredentials:
      description: Invalid credentials provided - use /token and /tokentfa before.

    comebackLater:
      description: Server is busy. Try again later (status code 503).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/comebackLaterResponse'

    invalidDataItemId:
      description: Study or report for the given ID is unknown.

    derivationNotAllowed:
      description: Token derivation is not allowed. The token does not have the dlx.derive scope or derivation is not enabled for this token.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "derivation_not_allowed"

    derivationExceedsParent:
      description: Derived token cannot exceed parent token's constraints (e.g., expiration date exceeds parent's expiration, study UIDs not subset of parent's allowed UIDs).
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              details:
                type: string
            example:
              error: "derivation_exceeds_parent"
              details: "expiresAt cannot exceed 2024-03-10T16:15:50Z"
              
    unexpectedError:
      description: Unexpected internal error.              

tags:
  - name: DLX-Download
    description: APIs used to download and access medical data via DLX token links.
  - name: DLX-Tokens
    description: APIs used to manage DLX token links.
  - name: DLX-Import
    description: APIs used to import and transfer data from external DLX token links.
  - name: DLX-Info
    description: Provides information on version and implemented capabilities of the API.
  - name: DLX-ConsumerContext
    description: |-
      Endpoints accessible via TFA authentication (/token → /tokentfa → JWT).
      Scopes: dlx.derive
  - name: DLX-ManagementContext
    description: |-
      Endpoints accessible via admin authentication (/admin_auth → JWT).
      Scopes: dlx.tokens, dlx.import
      Note: Some endpoints (e.g. /tokens CRUD) support both DLX-ConsumerContext and DLX-ManagementContext
      but use different authentication methods (TFA vs. /admin_auth).